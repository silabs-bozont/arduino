# macOS overlay: published REST/Web ports (no host networking).
# Colima/Docker Desktop cannot pass through USB serial devices, so the host
# bridges the RCP over TCP (socat) and the container uses NETWORK_DEVICE +
# /tmp/ttyOTBR (see matter_hil_util.start_otbr / start_otbr.sh).
services:
  otbr:
    ports:
      - "8081:8081"
      - "8080:8080"
    devices:
      - /dev/net/tun:/dev/net/tun
